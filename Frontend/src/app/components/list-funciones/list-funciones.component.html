<app-progress-bar *ngIf="loading"></app-progress-bar>
<div *ngIf="!loading" class="container">
    <div class="title">
        <h4>Listado de Funciones</h4>
        <button type="button" class="btn btn-primary" routerLink="add">Agregar Función</button>
    </div>
    <br>
    <table class="table table-hover mt-3" *ngIf="listFunciones.length > 0">
        <thead>
            <tr class="table table-hover">
                <th scope="col">ID</th>
                <th scope="col">Película</th>
                <th scope="col">Sala</th>
                <th scope="col">Sucursal</th>
                <th scope="col">Fecha</th>
                <th scope="col">Hora</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of listFunciones" class="table-secondary">
                <td>{{ item.id }}</td>
                <td>{{ movieMap[item.movie_id] || item.movie_id }}</td>
                <td>{{ item.sala_id }}</td>
                <td>{{ item.sucursal_id }}</td>
                <td>{{ item.fecha_funcion }}</td>
                <td>{{ item.hora_funcion }}</td>
                <td>
                    <button [routerLink]="['edit', item.id]" class="btn btn-info btn-sm">Editar</button>
                    <button (click)="item.id && deleteFuncion(item.id)"
                        class="btn btn-danger btn-sm ms-2">Eliminar</button>
                </td>
            </tr>
        </tbody>
    </table>
    <h5 *ngIf="listFunciones.length == 0" class="mt-3">No hay funciones registradas</h5>
</div>
