<div class="featured-banner" *ngIf="featuredMovie && !loading">
  <div class="banner-overlay"></div>
  <img [src]="getImageUrl(featuredMovie.imagen || featuredMovie.image)" alt="Featured Movie" class="banner-image">
  <div class="banner-content">
    <h1 class="featured-title">{{ featuredMovie.nombre || featuredMovie.title }}</h1>
    <p class="featured-description">{{ featuredMovie.descripcion || featuredMovie.description }}</p>
    <button class="btn btn-primary btn-lg"
      (click)="goToMovieDetails(featuredMovie.id_pelicula || featuredMovie.id_movie)">
      Ver Detalles
    </button>
  </div>
</div>


<div class="carousels-section" *ngIf="!loading && moviesByGenre.length > 0">
  <div class="genre-carousel" *ngFor="let carousel of moviesByGenre">
    <div class="genre-header">
      <h2 class="genre-title">{{ carousel.genre }}</h2>
    </div>

    <div class="carousel-wrapper">
      <button class="carousel-btn carousel-btn-prev" (click)="scrollCarousel('left', 'carousel-' + carousel.genre)">
        ‹
      </button>

      <div [id]="'carousel-' + carousel.genre" class="carousel-container">
        <div class="carousel-card" *ngFor="let movie of carousel.movies"
          (click)="goToMovieDetails(movie.id_pelicula || movie.id_movie)" title="{{ movie.nombre || movie.title }}">
          <div class="carousel-poster">
            <img [src]="getImageUrl(movie.imagen || movie.image)" [alt]="movie.nombre || movie.title"
              class="carousel-image">
          </div>
          <div class="carousel-info mt-2 text-center">
            <h5 class="text-white text-truncate">{{ movie.nombre || movie.title }}</h5>
          </div>
        </div>
      </div>

      <button class="carousel-btn carousel-btn-next" (click)="scrollCarousel('right', 'carousel-' + carousel.genre)">
        ›
      </button>
    </div>
  </div>
</div>


<div class="text-center loading-section" *ngIf="loading">
  <div class="spinner-border text-info" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p class="mt-3">Cargando películas...</p>
</div>


<div class="alert alert-info empty-state" *ngIf="!loading && allMovies.length === 0">
  <h4>No hay películas disponibles</h4>
  <p>En este momento no hay películas en cartelera</p>
</div>
